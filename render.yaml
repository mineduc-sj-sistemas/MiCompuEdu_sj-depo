databases:
  - name: micompuedu-db
    databaseName: micompuedu_db
    user: micompuedu_user
    plan: free

services:
  # 1. Backend API (.NET 8 con Docker)
  - type: web
    name: micompuedu-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: micompuedu-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: MiCompuEdu_Issuer
      - key: Jwt__Audience
        value: MiCompuEdu_Audience

  # 2. Frontend Web (React + Vite Static Site)
  - type: web
    name: micompuedu-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
