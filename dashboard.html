<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiCompuEdu — Dashboard de Entregas de Netbooks</title>
    <meta name="description" content="Panel de control interactivo para el seguimiento de entrega de netbooks del programa MiCompuEdu San Juan">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a2235;
            --bg-card-hover: #1f2a40;
            --bg-glass: rgba(26, 34, 53, 0.7);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(99, 102, 241, 0.3);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #6366f1;
            --accent-primary-light: #818cf8;
            --accent-secondary: #06b6d4;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-danger: #ef4444;
            --accent-pink: #ec4899;
            --gradient-primary: linear-gradient(135deg, #6366f1, #06b6d4);
            --gradient-warm: linear-gradient(135deg, #f59e0b, #ef4444);
            --gradient-cool: linear-gradient(135deg, #06b6d4, #10b981);
            --gradient-purple: linear-gradient(135deg, #8b5cf6, #ec4899);
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 30px rgba(99, 102, 241, 0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background effects */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 80%, rgba(236, 72, 153, 0.04) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px 32px 64px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0 32px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 32px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background: var(--gradient-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .header-title h1 {
            font-size: 26px;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header-title p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 400;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-warning);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* KPI Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-glow);
            box-shadow: var(--shadow-glow);
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }

        .kpi-card:nth-child(1)::before { background: var(--gradient-primary); }
        .kpi-card:nth-child(2)::before { background: var(--gradient-cool); }
        .kpi-card:nth-child(3)::before { background: var(--gradient-purple); }
        .kpi-card:nth-child(4)::before { background: var(--gradient-warm); }
        .kpi-card:nth-child(5)::before { background: linear-gradient(135deg, #10b981, #06b6d4); }

        .kpi-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 16px;
        }

        .kpi-card:nth-child(1) .kpi-icon { background: rgba(99, 102, 241, 0.15); }
        .kpi-card:nth-child(2) .kpi-icon { background: rgba(6, 182, 212, 0.15); }
        .kpi-card:nth-child(3) .kpi-icon { background: rgba(139, 92, 246, 0.15); }
        .kpi-card:nth-child(4) .kpi-icon { background: rgba(245, 158, 11, 0.15); }
        .kpi-card:nth-child(5) .kpi-icon { background: rgba(16, 185, 129, 0.15); }

        .kpi-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1;
        }

        .kpi-card:nth-child(1) .kpi-value { color: var(--accent-primary-light); }
        .kpi-card:nth-child(2) .kpi-value { color: var(--accent-secondary); }
        .kpi-card:nth-child(3) .kpi-value { color: #a78bfa; }
        .kpi-card:nth-child(4) .kpi-value { color: var(--accent-warning); }
        .kpi-card:nth-child(5) .kpi-value { color: var(--accent-success); }

        .kpi-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px;
            transition: all 0.3s ease;
        }

        .chart-card:hover {
            border-color: var(--border-glow);
        }

        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .chart-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Bar Chart */
        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .bar-row {
            display: grid;
            grid-template-columns: 200px 1fr 60px;
            align-items: center;
            gap: 12px;
            font-size: 12px;
        }

        .bar-label {
            color: var(--text-secondary);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bar-track {
            height: 28px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            border-radius: 6px;
            background: var(--gradient-primary);
            transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            min-width: 2px;
        }

        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 30%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1));
        }

        .bar-value {
            color: var(--text-secondary);
            font-weight: 600;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Donut Chart */
        .donut-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .donut-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .donut-svg {
            transform: rotate(-90deg);
        }

        .donut-center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .donut-center-value {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .donut-center-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .donut-legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .legend-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            font-size: 13px;
        }

        .legend-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }

        .legend-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .legend-value {
            color: var(--text-primary);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* Issues Panel */
        .issues-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .issue-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .issue-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .issue-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .issue-icon.danger {
            background: rgba(239, 68, 68, 0.15);
        }

        .issue-icon.warning {
            background: rgba(245, 158, 11, 0.15);
        }

        .issue-title {
            font-size: 15px;
            font-weight: 700;
        }

        .issue-count {
            font-size: 12px;
            color: var(--text-muted);
        }

        .issue-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .issue-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            font-size: 13px;
            border-left: 3px solid;
            transition: background 0.2s;
        }

        .issue-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .issue-item.danger { border-color: var(--accent-danger); }
        .issue-item.warning { border-color: var(--accent-warning); }
        .issue-item.info { border-color: var(--accent-secondary); }

        .issue-item-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .issue-item-value {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* Table */
        .table-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px;
            margin-bottom: 24px;
        }

        .table-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            max-width: 400px;
            padding: 10px 16px 10px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }

        .filter-select {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-select:focus {
            border-color: var(--accent-primary);
        }

        .filter-select option {
            background: var(--bg-secondary);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table thead th {
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.8px;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .data-table thead th:hover {
            color: var(--accent-primary-light);
        }

        .data-table tbody tr {
            transition: background 0.15s;
        }

        .data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .data-table tbody td {
            padding: 10px 14px;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-ok {
            background: rgba(16, 185, 129, 0.12);
            color: var(--accent-success);
        }

        .status-error {
            background: rgba(239, 68, 68, 0.12);
            color: var(--accent-danger);
        }

        .status-warning {
            background: rgba(245, 158, 11, 0.12);
            color: var(--accent-warning);
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .page-buttons {
            display: flex;
            gap: 4px;
        }

        .page-btn {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .page-btn:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--accent-primary);
            color: var(--accent-primary-light);
        }

        .page-btn.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 12px;
            border-top: 1px solid var(--border-subtle);
            margin-top: 32px;
        }

        /* Loading */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: 20px;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-subtle);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .animate-in:nth-child(1) { animation-delay: 0.05s; }
        .animate-in:nth-child(2) { animation-delay: 0.1s; }
        .animate-in:nth-child(3) { animation-delay: 0.15s; }
        .animate-in:nth-child(4) { animation-delay: 0.2s; }
        .animate-in:nth-child(5) { animation-delay: 0.25s; }

        /* Responsive */
        @media (max-width: 1200px) {
            .kpi-grid { grid-template-columns: repeat(3, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
            .issues-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .app-container { padding: 16px; }
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .kpi-value { font-size: 24px; }
            .bar-row { grid-template-columns: 120px 1fr 50px; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        .table-scroll {
            overflow-x: auto;
        }

        /* Number counter animation */
        @keyframes countUp {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <div class="loading-container" id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">Cargando datos de entregas...</div>
        </div>
    </div>

    <script>
    (async function() {
        // Load data
        let data;
        try {
            const response = await fetch('dashboard_data.json');
            if (!response.ok) throw new Error('No se pudo cargar dashboard_data.json');
            data = await response.json();
        } catch (err) {
            document.getElementById('loading').innerHTML = `
                <div style="text-align:center;">
                    <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
                    <h2 style="color:var(--accent-warning);margin-bottom:8px;">Error al cargar datos</h2>
                    <p style="color:var(--text-muted);">${err.message}</p>
                    <p style="color:var(--text-muted);margin-top:8px;font-size:13px;">Asegurate de que el archivo <code>dashboard_data.json</code> esté en la misma carpeta.</p>
                </div>
            `;
            return;
        }

        const app = document.getElementById('app');
        
        // Number formatter
        const fmt = n => new Intl.NumberFormat('es-AR').format(n);
        
        // Compute derived stats
        const totalProblemas = data.registrosProblematicos ? data.registrosProblematicos.length : 0;
        const pctOk = (((data.totalAlumnos - totalProblemas) / data.totalAlumnos) * 100).toFixed(1);
        const pctConUsuario = ((data.conUsuario / data.totalAlumnos) * 100).toFixed(1);

        // Grade colors
        const gradeColors = ['#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#ef4444', '#ec4899', '#8b5cf6', '#14b8a6'];

        // Build the dashboard
        app.innerHTML = `
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <div class="logo-icon">💻</div>
                    <div class="header-title">
                        <h1>MiCompuEdu San Juan</h1>
                        <p>Dashboard de Entrega de Netbooks — ${fmt(data.totalAlumnos)} registros</p>
                    </div>
                </div>
                <div class="header-right">
                    <span class="badge badge-success"><span class="pulse-dot"></span> Datos cargados</span>
                    <span class="badge badge-warning">⚠️ ${totalProblemas} observaciones</span>
                </div>
            </header>

            <!-- KPI Cards -->
            <div class="kpi-grid">
                <div class="kpi-card animate-in">
                    <div class="kpi-icon">👨‍🎓</div>
                    <div class="kpi-label">Alumnos</div>
                    <div class="kpi-value" data-count="${data.totalAlumnos}">0</div>
                    <div class="kpi-sub">Netbooks entregadas</div>
                </div>
                <div class="kpi-card animate-in">
                    <div class="kpi-icon">💻</div>
                    <div class="kpi-label">Netbooks Únicas</div>
                    <div class="kpi-value" data-count="${data.totalNetbooks}">0</div>
                    <div class="kpi-sub">${data.duplicadosNetbook.length} con duplicado</div>
                </div>
                <div class="kpi-card animate-in">
                    <div class="kpi-icon">🏫</div>
                    <div class="kpi-label">Escuelas</div>
                    <div class="kpi-value" data-count="${data.totalEscuelas}">0</div>
                    <div class="kpi-sub">Instituciones alcanzadas</div>
                </div>
                <div class="kpi-card animate-in">
                    <div class="kpi-icon">👨‍👩‍👧</div>
                    <div class="kpi-label">Tutores Únicos</div>
                    <div class="kpi-value" data-count="${data.totalTutores}">0</div>
                    <div class="kpi-sub">Responsables registrados</div>
                </div>
                <div class="kpi-card animate-in">
                    <div class="kpi-icon">✅</div>
                    <div class="kpi-label">Cuentas Microsoft</div>
                    <div class="kpi-value" data-count="${data.conUsuario}">0</div>
                    <div class="kpi-sub">${pctConUsuario}% del total</div>
                </div>
            </div>

            <!-- Charts -->
            <div class="charts-grid">
                <div class="chart-card animate-in">
                    <div class="chart-header">
                        <div>
                            <div class="chart-title">Top 15 Escuelas con más entregas</div>
                            <div class="chart-subtitle">Cantidad de netbooks entregadas por escuela</div>
                        </div>
                    </div>
                    <div class="bar-chart" id="schoolChart"></div>
                </div>
                <div class="chart-card animate-in">
                    <div class="chart-header">
                        <div>
                            <div class="chart-title">Distribución por Grado</div>
                            <div class="chart-subtitle">Netbooks entregadas según nivel</div>
                        </div>
                    </div>
                    <div class="donut-container" id="gradeChart"></div>
                </div>
            </div>

            <!-- Issues -->
            <div class="issues-grid">
                <div class="issue-card animate-in">
                    <div class="issue-header">
                        <div class="issue-icon danger">🔍</div>
                        <div>
                            <div class="issue-title">Registros con Observaciones</div>
                            <div class="issue-count">${totalProblemas} registros requieren atención</div>
                        </div>
                    </div>
                    <div class="issue-list" id="issuesList"></div>
                </div>
                <div class="issue-card animate-in">
                    <div class="issue-header">
                        <div class="issue-icon warning">📊</div>
                        <div>
                            <div class="issue-title">Resumen de Completitud</div>
                            <div class="issue-count">Campos faltantes por categoría</div>
                        </div>
                    </div>
                    <div class="issue-list" id="completenessPanel"></div>
                </div>
            </div>

            <!-- Problematic Records Table -->
            <div class="table-card animate-in" id="tableSection" style="${totalProblemas === 0 ? 'display:none' : ''}">
                <div class="chart-header">
                    <div>
                        <div class="chart-title">Registros Problemáticos</div>
                        <div class="chart-subtitle">Detalle de los registros que requieren revisión manual</div>
                    </div>
                </div>
                <div class="table-controls">
                    <div class="search-wrapper">
                        <span class="search-icon">🔎</span>
                        <input type="text" class="search-input" id="tableSearch" placeholder="Buscar por nombre, DNI, netbook o escuela...">
                    </div>
                    <select class="filter-select" id="problemFilter">
                        <option value="">Todos los problemas</option>
                    </select>
                </div>
                <div class="table-scroll">
                    <table class="data-table" id="dataTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Netbook</th>
                                <th>DNI Alumno</th>
                                <th>Nombre Alumno</th>
                                <th>Problema</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                <div class="pagination" id="pagination"></div>
            </div>

            <!-- All Schools Table -->
            <div class="table-card animate-in">
                <div class="chart-header">
                    <div>
                        <div class="chart-title">Todas las Escuelas</div>
                        <div class="chart-subtitle">${fmt(data.totalEscuelas)} escuelas registradas</div>
                    </div>
                </div>
                <div class="table-controls">
                    <div class="search-wrapper">
                        <span class="search-icon">🔎</span>
                        <input type="text" class="search-input" id="schoolSearch" placeholder="Buscar escuela...">
                    </div>
                </div>
                <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Escuela</th>
                                <th>Netbooks Entregadas</th>
                                <th>% del Total</th>
                            </tr>
                        </thead>
                        <tbody id="schoolTableBody"></tbody>
                    </table>
                </div>
                <div class="pagination" id="schoolPagination"></div>
            </div>

            <footer class="footer">
                <p>MiCompuEdu San Juan — Dashboard generado el ${new Date().toLocaleDateString('es-AR', { day: '2-digit', month: 'long', year: 'numeric' })}</p>
            </footer>
        `;

        // === ANIMATE COUNTERS ===
        document.querySelectorAll('.kpi-value[data-count]').forEach(el => {
            const target = parseInt(el.dataset.count);
            const duration = 1500;
            const start = performance.now();
            const animate = (now) => {
                const progress = Math.min((now - start) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                el.textContent = fmt(Math.floor(target * eased));
                if (progress < 1) requestAnimationFrame(animate);
            };
            setTimeout(() => requestAnimationFrame(animate), 300);
        });

        // === SCHOOL BAR CHART ===
        const schoolChart = document.getElementById('schoolChart');
        const topSchools = data.top20Escuelas.slice(0, 15);
        const maxSchool = topSchools[0]?.cantidad || 1;
        
        topSchools.forEach((s, i) => {
            const pct = (s.cantidad / maxSchool * 100).toFixed(1);
            const row = document.createElement('div');
            row.className = 'bar-row';
            row.innerHTML = `
                <span class="bar-label" title="${s.escuela}">${s.escuela}</span>
                <div class="bar-track">
                    <div class="bar-fill" style="width: 0%; transition-delay: ${i * 50}ms;"></div>
                </div>
                <span class="bar-value">${fmt(s.cantidad)}</span>
            `;
            schoolChart.appendChild(row);
            setTimeout(() => {
                row.querySelector('.bar-fill').style.width = pct + '%';
            }, 100);
        });

        // === DONUT CHART ===
        const gradeChart = document.getElementById('gradeChart');
        const grades = data.porGrado || [];
        const totalForDonut = grades.reduce((s, g) => s + g.cantidad, 0);
        
        let donutHTML = '<div class="donut-wrapper"><svg class="donut-svg" width="200" height="200" viewBox="0 0 200 200">';
        const cx = 100, cy = 100, r = 80;
        const circumference = 2 * Math.PI * r;
        let offset = 0;
        
        grades.forEach((g, i) => {
            const pct = g.cantidad / totalForDonut;
            const dash = pct * circumference;
            const color = gradeColors[i % gradeColors.length];
            donutHTML += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" 
                stroke-width="24" stroke-dasharray="${dash} ${circumference - dash}" 
                stroke-dashoffset="${-offset}" stroke-linecap="round" opacity="0.9"/>`;
            offset += dash;
        });
        
        donutHTML += `</svg><div class="donut-center-text">
            <div class="donut-center-value">${grades.length}</div>
            <div class="donut-center-label">Grados</div>
        </div></div>`;
        
        donutHTML += '<div class="donut-legend">';
        grades.forEach((g, i) => {
            const pct = ((g.cantidad / totalForDonut) * 100).toFixed(1);
            const color = gradeColors[i % gradeColors.length];
            donutHTML += `<div class="legend-item">
                <div class="legend-left">
                    <div class="legend-dot" style="background:${color}"></div>
                    <span class="legend-label">${g.grado}</span>
                </div>
                <span class="legend-value">${fmt(g.cantidad)} <span style="color:var(--text-muted);font-weight:400;font-size:11px">(${pct}%)</span></span>
            </div>`;
        });
        donutHTML += '</div>';
        gradeChart.innerHTML = donutHTML;

        // === ISSUES PANEL ===
        const issuesList = document.getElementById('issuesList');
        const issuesSummary = {};
        (data.registrosProblematicos || []).forEach(r => {
            const problems = r.problema.split(' | ');
            problems.forEach(p => { issuesSummary[p] = (issuesSummary[p] || 0) + 1; });
        });
        
        const issueColors = {
            'DUPLICADO_NETBOOK': 'danger',
            'DUPLICADO_DNI': 'danger',
            'SIN_USUARIO': 'warning',
            'SIN_ESCUELA': 'info',
            'SIN_SECCION': 'info'
        };

        const issueLabels = {
            'DUPLICADO_NETBOOK': '🔴 Netbook duplicada',
            'DUPLICADO_DNI': '🔴 DNI duplicado',
            'SIN_USUARIO': '🟡 Sin cuenta Microsoft',
            'SIN_ESCUELA': '🟡 Sin escuela asignada',
            'SIN_SECCION': '🔵 Sin sección'
        };

        Object.entries(issuesSummary).sort((a, b) => b[1] - a[1]).forEach(([key, count]) => {
            const div = document.createElement('div');
            div.className = `issue-item ${issueColors[key] || 'info'}`;
            div.innerHTML = `
                <span class="issue-item-label">${issueLabels[key] || key}</span>
                <span class="issue-item-value" style="color: ${key.includes('DUPLICADO') ? 'var(--accent-danger)' : 'var(--accent-warning)'}">${count}</span>
            `;
            issuesList.appendChild(div);
        });

        if (Object.keys(issuesSummary).length === 0) {
            issuesList.innerHTML = '<div class="issue-item info"><span class="issue-item-label">✅ No se encontraron problemas</span></div>';
        }

        // === COMPLETENESS PANEL ===
        const completenessPanel = document.getElementById('completenessPanel');
        const completenessData = [
            { label: '📧 Sin Email', count: data.sinEmail || 0, total: data.totalAlumnos },
            { label: '👤 Sin Usuario M365', count: data.sinUsuario || 0, total: data.totalAlumnos },
            { label: '🏫 Sin Escuela', count: data.sinEscuela || 0, total: data.totalAlumnos },
            { label: '📝 Sin Sección', count: data.sinSeccion || 0, total: data.totalAlumnos },
        ];

        completenessData.forEach(c => {
            const pct = (((c.total - c.count) / c.total) * 100).toFixed(1);
            const cls = c.count === 0 ? 'info' : c.count < 20 ? 'warning' : 'danger';
            const div = document.createElement('div');
            div.className = `issue-item ${cls}`;
            div.innerHTML = `
                <span class="issue-item-label">${c.label}</span>
                <span class="issue-item-value">${c.count === 0 ? '✅ 0' : c.count} <span style="color:var(--text-muted);font-weight:400;font-size:11px">(${pct}% completo)</span></span>
            `;
            completenessPanel.appendChild(div);
        });

        // === PROBLEMATIC RECORDS TABLE ===
        const records = data.registrosProblematicos || [];
        const PAGE_SIZE = 15;
        let currentPage = 1;
        let filteredRecords = [...records];

        // Populate filter
        const problemFilter = document.getElementById('problemFilter');
        const uniqueProblems = [...new Set(records.flatMap(r => r.problema.split(' | ')))];
        uniqueProblems.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p;
            opt.textContent = issueLabels[p] || p;
            problemFilter.appendChild(opt);
        });

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const start = (currentPage - 1) * PAGE_SIZE;
            const pageData = filteredRecords.slice(start, start + PAGE_SIZE);
            
            tbody.innerHTML = pageData.map(r => {
                const statusClass = r.problema.includes('DUPLICADO') ? 'status-error' : 
                                    r.problema.includes('SIN_USUARIO') ? 'status-warning' : 'status-warning';
                return `<tr>
                    <td>${r.id}</td>
                    <td><strong>${r.netbook}</strong></td>
                    <td>${r.dniAlumno}</td>
                    <td>${r.nombreAlumno}</td>
                    <td><span class="status-badge ${statusClass}">${r.problema}</span></td>
                </tr>`;
            }).join('');

            // Pagination
            const totalPages = Math.ceil(filteredRecords.length / PAGE_SIZE);
            const pag = document.getElementById('pagination');
            pag.innerHTML = `
                <span>Mostrando ${start + 1}-${Math.min(start + PAGE_SIZE, filteredRecords.length)} de ${filteredRecords.length}</span>
                <div class="page-buttons">
                    <button class="page-btn" onclick="window.__goPage(1)" ${currentPage === 1 ? 'disabled' : ''}>«</button>
                    <button class="page-btn" onclick="window.__goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>
                    ${Array.from({length: Math.min(totalPages, 7)}, (_, i) => {
                        let p;
                        if (totalPages <= 7) p = i + 1;
                        else if (currentPage <= 4) p = i + 1;
                        else if (currentPage >= totalPages - 3) p = totalPages - 6 + i;
                        else p = currentPage - 3 + i;
                        return `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="window.__goPage(${p})">${p}</button>`;
                    }).join('')}
                    <button class="page-btn" onclick="window.__goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>›</button>
                    <button class="page-btn" onclick="window.__goPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>»</button>
                </div>
            `;
        }

        window.__goPage = (p) => {
            const totalPages = Math.ceil(filteredRecords.length / PAGE_SIZE);
            currentPage = Math.max(1, Math.min(p, totalPages));
            renderTable();
        };

        function applyFilters() {
            const search = document.getElementById('tableSearch').value.toLowerCase();
            const problem = problemFilter.value;
            filteredRecords = records.filter(r => {
                const matchSearch = !search || 
                    (r.nombreAlumno || '').toLowerCase().includes(search) ||
                    String(r.dniAlumno).includes(search) ||
                    (r.netbook || '').toLowerCase().includes(search);
                const matchProblem = !problem || r.problema.includes(problem);
                return matchSearch && matchProblem;
            });
            currentPage = 1;
            renderTable();
        }

        document.getElementById('tableSearch')?.addEventListener('input', applyFilters);
        problemFilter?.addEventListener('change', applyFilters);
        renderTable();

        // === ALL SCHOOLS TABLE ===
        const allSchools = data.porEscuela || [];
        const SCHOOL_PAGE_SIZE = 20;
        let schoolPage = 1;
        let filteredSchools = [...allSchools];

        function renderSchoolTable() {
            const tbody = document.getElementById('schoolTableBody');
            const start = (schoolPage - 1) * SCHOOL_PAGE_SIZE;
            const pageData = filteredSchools.slice(start, start + SCHOOL_PAGE_SIZE);
            
            tbody.innerHTML = pageData.map((s, i) => {
                const pct = ((s.cantidad / data.totalAlumnos) * 100).toFixed(2);
                return `<tr>
                    <td>${start + i + 1}</td>
                    <td><strong>${s.escuela}</strong></td>
                    <td>${fmt(s.cantidad)}</td>
                    <td>${pct}%</td>
                </tr>`;
            }).join('');

            const totalPages = Math.ceil(filteredSchools.length / SCHOOL_PAGE_SIZE);
            const pag = document.getElementById('schoolPagination');
            pag.innerHTML = `
                <span>Mostrando ${start + 1}-${Math.min(start + SCHOOL_PAGE_SIZE, filteredSchools.length)} de ${filteredSchools.length} escuelas</span>
                <div class="page-buttons">
                    <button class="page-btn" onclick="window.__goSchoolPage(${schoolPage - 1})" ${schoolPage === 1 ? 'disabled' : ''}>‹ Anterior</button>
                    <span style="padding: 6px 12px; font-size: 12px;">Página ${schoolPage} de ${totalPages}</span>
                    <button class="page-btn" onclick="window.__goSchoolPage(${schoolPage + 1})" ${schoolPage === totalPages ? 'disabled' : ''}>Siguiente ›</button>
                </div>
            `;
        }

        window.__goSchoolPage = (p) => {
            const totalPages = Math.ceil(filteredSchools.length / SCHOOL_PAGE_SIZE);
            schoolPage = Math.max(1, Math.min(p, totalPages));
            renderSchoolTable();
        };

        document.getElementById('schoolSearch')?.addEventListener('input', (e) => {
            const search = e.target.value.toLowerCase();
            filteredSchools = allSchools.filter(s => s.escuela.toLowerCase().includes(search));
            schoolPage = 1;
            renderSchoolTable();
        });

        renderSchoolTable();

    })();
    </script>
</body>
</html>
